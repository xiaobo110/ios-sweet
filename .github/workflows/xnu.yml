# Same build as ios-sweet-k60, against a retargeted copy of its patch series:
# tools/retarget-k60-patches.py rewrites only the panel/touch literals and
# freezes their occurrence counts in tools/patch-retarget.lock.json. Re-run it
# (and --freeze) whenever the K60 series moves; the lock turns silent drift into
# a hard failure here instead of a kernel built for the wrong panel.
name: xnu

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose xnu to build (13.5 = xnu-8796, iOS 16 era)
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG
        default: SWEET
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"
      cache_gen:
        description: bump to invalidate the dxb build cache
        default: "v1"
  push:
    # diting lives on its own branch of xiaobo110/ios-sweet; main there is the
    # sweet (Note 10 Pro) tree and must not be disturbed.
    branches: [main, diting]
    paths:
      - "xnu/patches/**"
      # The boot image is assembled from these, so a shim or packing change has
      # to rebuild it - otherwise a fix here silently waits for the next kernel
      # patch commit, which is how the CRLF build.sh sat red for a whole round.
      - "shim/**"
      - "tools/**"
      - "board/**"
      - ".github/workflows/xnu.yml"

concurrency:
  group: xnu-${{ github.ref }}
  # 不取消正在跑的那条：一次构建七分钟，让它跑完再排下一条。原来 cancel 掉
  # 之后，那条的产物就没了，对 0235 那种"刚推完又补一刀"的情况尤其坑。
  cancel-in-progress: false

# 新仓库的 GITHUB_TOKEN 默认只读，ci-log / ci-artifacts 两个分支推不上去。
permissions:
  contents: write

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'SWEET' }}

jobs:
  build:
    # macos-14 的 runner 已被 GitHub 下线（作业秒取消）；macos-15 只有 Xcode 16.x。
    # Xcode 16 的 iig 会给 IORPC 加 kernelContent 字段，xnu-8796 里没有，
    # 所以下面有一个步骤把生成的 IORPC 头改回旧布局。
    #
    # arm64 的 macos-15 机池长期抢不到机位：连续三次都是
    # "The job was not acquired by Runner of type hosted" 排到 15 分钟被取消，
    # 一个字节都没编。改走 Intel 池。xnu 本来就交叉编 arm64，主机架构只影响
    # 工具链；Intel 上 Homebrew 前缀是 /usr/local，Deps 里补一条软链让脚本里
    # 写死的 /opt/homebrew 路径照样能解析。
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Restore dxb build cache
        id: bcache
        uses: actions/cache/restore@v4
        with:
          path: dxb
          key: dxb-${{ env.MACOS_VERSION }}-${{ env.DXB_SHA }}-${{ runner.arch }}-${{ inputs.cache_gen || 'v5' }}-${{ hashFiles('xnu/patches/**') }}

      - name: Fetch build script
        if: steps.bcache.outputs.cache-hit != 'true'
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          # 12.5-14.3 use the top-level patches dir; ours go next to blacktop's
          cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/
          # libfirehose_kernel is built arm64e-only; the SWEET kernel is plain arm64
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh
          ls dxb/patches

      - name: Normalise cached tree
        run: |
          # The upstream script skips a patch whose `git apply --check` fails, so a
          # cached, already-patched tree would silently keep stale patches. Reset the
          # xnu work tree first: only files we patch get new mtimes, so make then
          # rebuilds just those (that is where the speed-up comes from).
          if [ -d dxb/xnu/.git ]; then
            git -C dxb/xnu checkout -- . || true
            git -C dxb/xnu clean -fdq || true
          fi
          rm -rf dxb/patches
          mkdir -p dxb/patches
          cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/ 2>/dev/null || true
          ls dxb/patches | head -50
          # libfirehose_kernel is built arm64e-only; the SWEET kernel is plain arm64
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh || true
          grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh || true

      - name: Deps
        run: |
          BREW=$(brew --prefix)
          if [ "$BREW" != /opt/homebrew ] && [ ! -e /opt/homebrew ]; then
            sudo mkdir -p /opt
            sudo ln -s "$BREW" /opt/homebrew
          fi
          brew install jq gum bash cmake ninja python@3.11
          # xnu's lldbmacros are py_compile'd with python3; 3.12+ rejects their tabs
          mkdir -p "$HOME/py311" && ln -sf /opt/homebrew/opt/python@3.11/bin/python3.11 "$HOME/py311/python3"
          echo "$HOME/py311" >> "$GITHUB_PATH"
          # make runs in this step too: point the system python3 at 3.11 now
          sudo ln -sf /opt/homebrew/opt/python@3.11/bin/python3.11 /usr/local/bin/python3
          sudo ln -sf /opt/homebrew/opt/python@3.11/bin/python3.11 /usr/bin/python3 2>/dev/null || true
          # dxb/build.sh 会自己往 PATH 前面塞 /opt/homebrew/bin，那个 python3 是
          # 3.14，lldbmacros 的 syntax_checker 就报 "tab character"。直接换掉。
          sudo mv /opt/homebrew/bin/python3 /opt/homebrew/bin/python3.orig 2>/dev/null || true
          sudo ln -sf /opt/homebrew/opt/python@3.11/bin/python3.11 /opt/homebrew/bin/python3
          /opt/homebrew/bin/python3 --version
          python3 --version
          # build.sh only checks that xcodes exists (Xcode is preinstalled); no bottle on macOS 14
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig

      - name: Pin lldbmacros to python 3.11
        run: |
          # lldbmacros 的规则是直接执行 core/syntax_checker.py，走的是它自己的
          # shebang，所以 $GITHUB_PATH 里那个 py311 目录压不住 /opt/homebrew/bin
          # 上的 python3（runner 上已经是 3.14），kcdata.py 就报 "tab character"。
          # 直接把 shebang 改成 3.11 的绝对路径，绕开 PATH 顺序。
          # 缓存未命中时 dxb/xnu 还不存在（build.sh 自己 clone），这一步就空跑。
          P=/opt/homebrew/opt/python@3.11/bin/python3.11
          n=0
          for f in $(grep -rl '^#!/usr/bin/env python3' dxb/xnu/tools/lldbmacros 2>/dev/null || true); do
            sed -i '' "1s|.*|#!$P|" "$f"
            n=$((n+1))
          done
          echo "repinned $n lldbmacros scripts"
          head -1 dxb/xnu/tools/lldbmacros/core/syntax_checker.py 2>/dev/null || echo "no tree yet"
          "$P" --version

      - name: Build
        working-directory: dxb
        env:
          # keep going after errors so one run reports every compile failure
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: |
          set -o pipefail
          bash build.sh 2>&1 | tee build.log

      # Anonymous log reads are 404 on GitHub, but check-run annotations are
      # public, so on failure the compiler diagnostics are republished as
      # error annotations - that is how a failed build is readable from here.
      - name: Surface compile errors
        if: failure()
        run: |
          set +o pipefail
          test -f dxb/build.log || { echo "::error::build.log missing"; exit 0; }
          grep -nE "error:|fatal:|Skipping patch|Error [0-9]+|Undefined symbols|ld: " dxb/build.log \
            | grep -v "warning:" | head -10 | while IFS= read -r line; do
              echo "::error::$line"
            done
          echo "::notice::build.log tail: $(tail -3 dxb/build.log | tr '\n' '|')"
          exit 0

      - name: Fail on skipped patches
        if: always()
        run: |
          # build.sh 对 git apply 失败的补丁只打印 warning 就跳过，构建照样"成功"，
          # 于是内核缺一整段功能还看不出来。这里把它变成硬失败。
          if grep -q 'Skipping patch' dxb/build.log 2>/dev/null; then
            echo "::error::some patches were skipped"
            grep -A1 'Skipping patch' dxb/build.log || true
            exit 1
          fi
          echo "all patches applied"

      - name: Package build tree for local compiles
        if: always()
        run: |
          # Generated headers, config option headers, mig output and the patched
          # source: enough to re-run any single compile command from the log locally.
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p sdk-kernel-platform
          cp -R "$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" sdk-kernel-platform/ || true
          tar czf buildtree.tgz \
            --exclude='*.o' --exclude='*.cpo' --exclude='*.a' --exclude='*.dSYM' --exclude='*.unstripped' \
            --exclude='kernel.development.*' --exclude='.git' \
            -C dxb build/xnu.obj fakeroot/usr/local/include xnu \
            -C .. sdk-kernel-platform
          ls -la buildtree.tgz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-buildtree
          path: buildtree.tgz
          retention-days: 7

      - name: Inspect closed KDK support libs
        if: always()
        run: |
          mkdir -p out/kdk-libs
          for lib in /Library/Developer/KDKs/*/System/Library/KernelSupport/lib*.a; do
            b=$(basename "$lib" .a)
            ar t "$lib" > "out/kdk-libs/$b.members.txt" 2>&1 || true
            nm -m "$lib" > "out/kdk-libs/$b.nm.txt" 2>&1 || true
            lipo -info "$lib" >> out/kdk-libs/arch.txt 2>&1 || true
          done
          ls -la out/kdk-libs

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          # The dxb build script short-circuits with "already built" when the
          # cached tree has the binary, and that path does not install it into
          # fakeroot, so pick the kernel straight out of the object dir too.
          for k in dxb/build/xnu.obj/*/kernel.*; do
            case "$k" in
              *.dSYM|*.link|*.unstripped) continue ;;
            esac
            [ -f "$k" ] && cp "$k" out/ 2>/dev/null || true
          done
          ls -la out
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true
          # A kernel-only tarball: the full artifact is ~83 MB and the local
          # download over this link takes minutes, this one is a few MB.
          (cd out && tar czf kernel-only.tgz kernel.development.sweet) || true

      - name: Save dxb build cache
        if: always() && steps.bcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: dxb
          key: dxb-${{ env.MACOS_VERSION }}-${{ env.DXB_SHA }}-${{ runner.arch }}-${{ inputs.cache_gen || 'v5' }}-${{ hashFiles('xnu/patches/**') }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel
          path: out/
          if-no-files-found: warn

      # 下载 Actions 产物要 token，匿名 API 只有 60 次/小时，日志页还是 JS 渲染。
      # 但 deploy key 的 SSH 推拉一直好用，所以诊断信息改走一个一次性分支：
      # 本地 `git fetch origin ci-log` 就能拿到整份错误列表，不碰 worktree。
      - name: Publish build log to ci-log branch
        if: always()
        run: |
          mkdir -p ci
          {
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "sha: $GITHUB_SHA"
            echo
            if [ -f dxb/build.log ]; then
              grep -nE "error:|fatal:|Skipping patch|Error [0-9]+|Undefined symbols|ld: " dxb/build.log \
                | grep -v "warning:" | head -300
              echo
              echo "---- tail ----"
              tail -40 dxb/build.log
              echo "---- lines ----"
              wc -l < dxb/build.log
            else
              echo "no dxb/build.log"
            fi
          } > ci/last-build.log 2>&1 || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          blob=$(git hash-object -w ci/last-build.log)
          tree=$(printf '100644 blob %s\tlast-build.log\n' "$blob" | git mktree)
          c=$(git commit-tree "$tree" -m "ci: build log for ${GITHUB_SHA:0:7}")
          git push -q -f origin "$c:refs/heads/ci-log"
          echo "pushed ci-log $c"

  # The shim is bare-metal aarch64 and needs a cross clang; this workspace has
  # neither NDK nor mkbootimg locally, so the boot image is packed here too.
  # tools/diting-mkbootimg.py replaces mkbootimg and tools/mkpayload.py turns
  # the Mach-O into the payload the shim appends after its own _end.
  boot-image:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: xnu-kernel
          path: kernel

      - name: Locate the kernel
        run: |
          ls -l kernel
          test -f kernel/kernel.development.sweet || test -f kernel/kernel.release.sweet

      - name: Android NDK
        run: |
          if [ -z "${ANDROID_NDK_HOME:-}" ] || [ ! -d "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64" ]; then
            curl -fsSL -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
            sudo unzip -q /tmp/ndk.zip -d /opt
            echo "ANDROID_NDK_HOME=/opt/android-ndk-r25c" >> "$GITHUB_ENV"
          fi
          ls "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" | head

      - name: Pack shim boot image
        run: |
          set -o pipefail
          K=$(ls kernel/kernel.*.sweet | head -1)
          NDK="$ANDROID_NDK_HOME" DTB=board/base.dtb \
            bash tools/diting-build-boot.sh "$K" out/shim-boot.img 2>&1 | tee boot.log

      - name: Verify the image
        run: |
          python3 - <<'PY'
          import struct
          b = open('out/shim-boot.img', 'rb').read()
          assert b[:8] == b'ANDROID!', b[:8]
          assert struct.unpack_from('<I', b, 40)[0] == 4, 'header is not v4'
          # The Android header carries only console=null by design: ABL mangles
          # whatever it finds there, so the real kernel cmdline rides inside the
          # SWEETXNU payload and is asserted against the whole blob instead.
          for token in (b'sweettouchoff=1', b'ufsroot=userdata', b'rd=ufsroot0'):
              assert token in b, token
          # The shim appends the SWEETXNU payload right after its own _end.
          assert b'SWEETXNU' in b, 'payload missing from the kernel blob'
          # These strings are what a PC sees over the shim's USB serial device
          # and what the retargeted wallpaper patch prints; K60's binary would
          # carry ios-sweet-k60 / 1440x3200 instead.
          assert b'ios-sweet-diting' in b, 'shim was not staged for diting'
          assert b'1220x2712, add sweetwp_w=1220' in b, 'kernel patches not retargeted'
          print('boot image v4, %d bytes, payload cmdline ok, diting markers present' % len(b))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: diting-boot
          path: out/shim-boot.img
          retention-days: 14

      # Same reason as ci-log in the build job: an artifact URL needs a token,
      # a branch needed only the deploy key. One forced commit per run so the
      # branch never accumulates size. On failure it carries boot.log instead of
      # an image, which is how a shim cross-compile error gets read from here.
      - name: Publish image to ci-artifacts branch
        if: always()
        run: |
          mkdir -p ci
          cp -f out/shim-boot.img ci/ 2>/dev/null || true
          cp -f boot.log ci/ 2>/dev/null || true
          cp -f /tmp/shim-build.log ci/ 2>/dev/null || true
          if [ -f ci/shim-boot.img ]; then sha256sum ci/shim-boot.img > ci/shim-boot.img.sha256; fi
          ls -l ci
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          : > /tmp/tree.txt
          for f in ci/*; do
            b=$(basename "$f")
            blob=$(git hash-object -w "$f")
            printf '100644 blob %s\t%s\n' "$blob" "$b" >> /tmp/tree.txt
          done
          tree=$(git mktree < /tmp/tree.txt)
          c=$(git commit-tree "$tree" -m "ci: diting boot artifacts from ${GITHUB_SHA:0:7}")
          git push -q -f origin "$c:refs/heads/ci-artifacts"
          echo "pushed ci-artifacts $c"
          cat ci/shim-boot.img.sha256 2>/dev/null || true
